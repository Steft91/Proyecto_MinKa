services:
  postgres:
    image: postgres:16-alpine
    container_name: minka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minka}
      POSTGRES_USER: ${POSTGRES_USER:-minka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minka} -d ${POSTGRES_DB:-minka}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
